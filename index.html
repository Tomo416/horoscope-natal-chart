// 簡易ジオコーディング関数：都道府県名・市区町村名 → [緯度, 経度]
function geocode(pref, city) {
  const cities = JP_LOCATIONS[pref];
  if (!cities) return null;
  const coords = cities[city];
  if (!coords) return null;
  return { lat: coords[0], lon: coords[1] };
}

/* =========================================================================
   天文計算（astronomy-engine を使用。ここでは度数の推測・創作は一切行わない）
   ========================================================================= */
function toRad(d) { return d * Math.PI / 180; }
function toDeg(r) { return r * 180 / Math.PI; }
function norm360(d) { return ((d % 360) + 360) % 360; }

// 黄道傾斜角（IAU2006 平均値、度）
function obliquityOfEcliptic(dateUTC) {
  const jd = dateUTC.getTime() / 86400000 + 2440587.5;
  const T = (jd - 2451545.0) / 36525;
  const epsArcsec = 84381.406 - 46.836769 * T - 0.0001831 * T * T + 0.00200340 * T * T * T;
  return epsArcsec / 3600;
}

// 10天体の黄経（度）を astronomy-engine から取得
function computeBodyLongitudes(dateUTC) {
  const A = Astronomy;
  const out = {};
  out.sun = A.SunPosition(dateUTC).elon;
  out.moon = A.EclipticGeoMoon(dateUTC).lon;
  const others = { mercury: A.Body.Mercury, venus: A.Body.Venus, mars: A.Body.Mars,
                    jupiter: A.Body.Jupiter, saturn: A.Body.Saturn, uranus: A.Body.Uranus,
                    neptune: A.Body.Neptune, pluto: A.Body.Pluto };
  for (const key in others) {
    const vec = A.GeoVector(others[key], dateUTC, true);
    out[key] = A.Ecliptic(vec).elon;
  }
  return out;
}

// ASC・MC（度）
function calcAscMc(RAMC, latDeg, epsDeg) {
  const ramc = toRad(RAMC), eps = toRad(epsDeg), lat = toRad(latDeg);
  const yA = Math.cos(ramc);
  const xA = -(Math.sin(ramc) * Math.cos(eps) + Math.tan(lat) * Math.sin(eps));
  const asc = norm360(toDeg(Math.atan2(yA, xA)));
  const mc = norm360(toDeg(Math.atan2(Math.sin(ramc), Math.cos(ramc) * Math.cos(eps))));
  return { asc, mc };
}

// 黄道上の点の赤経(RA) → 黄経
function raToEclLon(RAdeg, epsDeg) {
  const ra = toRad(RAdeg), eps = toRad(epsDeg);
  return norm360(toDeg(Math.atan2(Math.sin(ra), Math.cos(ra) * Math.cos(eps))));
}

// プラシーダス方式の中間カスプ（11・12・2・3ハウス）を反復計算で求める
// 参考: Munkasey "An Astrological House Formulary" の反復式
//   上半球(11,12): RA = RAMC + arccos(-sin(RA)*tanφ*tanε) / F
//   下半球(2,3)  : RA = RAMC + 180 - arccos(sin(RA)*tanφ*tanε) / F
function placidusRA(RAMC, latDeg, epsDeg, initialOffset, F, upper) {
  const lat = toRad(latDeg), eps = toRad(epsDeg);
  let RA = RAMC + initialOffset;
  for (let i = 0; i < 30; i++) {
    const raRad = toRad(RA);
    let arg = upper
      ? -Math.sin(raRad) * Math.tan(lat) * Math.tan(eps)
      :  Math.sin(raRad) * Math.tan(lat) * Math.tan(eps);
    arg = Math.max(-1, Math.min(1, arg)); // 極域での定義域外エラーを防ぐクランプ
    const acosDeg = toDeg(Math.acos(arg));
    const RAnew = upper ? (RAMC + acosDeg / F) : (RAMC + 180 - acosDeg / F);
    if (Math.abs(RAnew - RA) < 1e-8) { RA = RAnew; break; }
    RA = RAnew;
  }
  return RA;
}

// プラシーダス・ハウスカスプ（1〜12、単純な30度均等分割は一切行わない）
function placidusCusps(RAMC, latDeg, epsDeg) {
  const { asc, mc } = calcAscMc(RAMC, latDeg, epsDeg);
  const ra11 = placidusRA(RAMC, latDeg, epsDeg, 30, 3, true);
  const ra12 = placidusRA(RAMC, latDeg, epsDeg, 60, 1.5, true);
  const ra2  = placidusRA(RAMC, latDeg, epsDeg, 120, 1.5, false);
  const ra3  = placidusRA(RAMC, latDeg, epsDeg, 150, 3, false);

  const H = new Array(13);
  H[1] = asc;
  H[10] = mc;
  H[11] = raToEclLon(ra11, epsDeg);
  H[12] = raToEclLon(ra12, epsDeg);
  H[2] = raToEclLon(ra2, epsDeg);
  H[3] = raToEclLon(ra3, epsDeg);
  H[4] = norm360(H[10] + 180);
  H[5] = norm360(H[11] + 180);
  H[6] = norm360(H[12] + 180);
  H[7] = norm360(H[1] + 180);
  H[8] = norm360(H[2] + 180);
  H[9] = norm360(H[3] + 180);
  return H;
}

// 天体がどのハウスに入るか（実際のカスプ角度に基づく。均等分割ではない）
function findHouseOf(lon, H) {
  for (let n = 1; n <= 12; n++) {
    const a = H[n];
    const b = n < 12 ? H[n + 1] : H[1];
    const span = norm360(b - a);
    const rel = norm360(lon - a);
    if (rel < span) return n;
  }
  return 12;
}

function signIndexOf(lon) { return Math.floor(norm360(lon) / 30); }
function degInSign(lon) { return norm360(lon) % 30; }
function fmtDeg(lon) {
  const d = degInSign(lon);
  let deg = Math.floor(d);
  let min = Math.round((d - deg) * 60);
  if (min === 60) { min = 0; deg += 1; }
  if (deg === 30) { deg = 0; } // 念のための境界ガード（サイン境界の丸め誤差対策）
  return `${SIGNS[signIndexOf(lon)].name} ${deg}°${min.toString().padStart(2, '0')}'`;
}

// メインの計算：入力日時・緯度経度 → 10天体の黄経 + プラシーダス12ハウスカスプ
function computeChart(dateUTC, latDeg, lonDeg) {
  const eps = obliquityOfEcliptic(dateUTC);
  const gstHours = Astronomy.SiderealTime(dateUTC);
  const lstHours = norm360((gstHours + lonDeg / 15) * 15 / 15) ; // placeholder, replaced below
  let lst = ((gstHours + lonDeg / 15) % 24 + 24) % 24;
  const RAMC = lst * 15;
  const houses = placidusCusps(RAMC, latDeg, eps);
  const bodies = computeBodyLongitudes(dateUTC);
  const bodyHouses = {};
  for (const key in bodies) bodyHouses[key] = findHouseOf(bodies[key], houses);
  return { eps, RAMC, houses, bodies, bodyHouses, asc: houses[1], mc: houses[10] };
}

/* =========================================================================
   SVG座標変換（ASCを常に9時位置に固定して盤面を回転させる、実際のホロスコープソフトと同じ向き）
   ========================================================================= */
function angleToXY(lonDeg, r, cx, cy) {
  const a = toRad(lonDeg);
  return { x: cx - r * Math.sin(a), y: cy - r * Math.cos(a) };
}

/* =========================================================================
   React コンポーネント
   ========================================================================= */
function App() {
  const [date, setDate] = useState('1990-06-15');
  const [time, setTime] = useState('12:00');
  const prefList = useMemo(() => Object.keys(JP_LOCATIONS), []);
  const [pref, setPref] = useState('東京都');
  const [city, setCity] = useState('新宿区');
  const cityList = useMemo(() => Object.keys(JP_LOCATIONS[pref] || {}), [pref]);
  const [hover, setHover] = useState(null); // {x,y,lines:[...]}
  const [error, setError] = useState('');
  const [showDetails, setShowDetails] = useState(false);

  // 都道府県を変更したら、その中の最初の市区町村を自動選択する
  const onPrefChange = (newPref) => {
    setPref(newPref);
    const cities = Object.keys(JP_LOCATIONS[newPref] || {});
    setCity(cities[0] || '');
  };

  const chart = useMemo(() => {
    try {
      const [y, m, d] = date.split('-').map(Number);
      const [hh, mi] = time.split(':').map(Number);
      if (!y || !m || !d) return null;
      const coords = geocode(pref, city);
      if (!coords) { setError('緯度経度を取得できませんでした（市区町村を選び直してください）'); return null; }
      const tz = 9; // 全国市区町村を対象にしているため日本標準時（UTC+9）固定
      const utcMs = Date.UTC(y, m - 1, d, hh || 0, mi || 0) - tz * 3600 * 1000;
      const dateUTC = new Date(utcMs);
      const result = computeChart(dateUTC, coords.lat, coords.lon);
      setError('');
      return result;
    } catch (e) {
      setError('計算エラー: ' + e.message);
      return null;
    }
  }, [date, time, pref, city]);

  const cx = 300, cy = 300;
  const rOuter = 280;      // 星座リング外周
  const rSignIn = 244;     // 星座リング内周 / ハウスリング外周
  const rHouseIn = 190;    // ハウスリング内周
  const rPlanetOuter = 178;
  const rPlanetInner = 82;

  const rel = (lonDeg) => chart ? norm360(lonDeg - chart.asc + 90) : 0;

  // 天体同士が近い場合に半径を互い違いにずらして重なりを軽減する簡易ロジック
  const planetPositions = useMemo(() => {
    if (!chart) return [];
    const list = BODIES.map(b => ({ ...b, lon: chart.bodies[b.key], house: chart.bodyHouses[b.key] }));
    list.sort((a, b) => rel(a.lon) - rel(b.lon));
    let lastAngle = null, radiusToggle = 0;
    return list.map(p => {
      const a = rel(p.lon);
      if (lastAngle !== null && Math.abs(((a - lastAngle + 540) % 360) - 180) < 6) {
        radiusToggle = 1 - radiusToggle;
      } else {
        radiusToggle = 0;
      }
      lastAngle = a;
      const r = radiusToggle ? rPlanetInner + 34 : rPlanetOuter;
      return { ...p, angle: a, r };
    });
  }, [chart]);

  function showTooltip(x, y, lines) { setHover({ x, y, lines }); }
  function hideTooltip() { setHover(null); }

  return (
    <div className="max-w-6xl mx-auto px-4 py-8">
      <header className="text-center mb-8">
        <p className="text-xs tracking-[0.3em] text-indigo-300 uppercase mb-2">Natal Chart</p>
        <h1 className="text-3xl md:text-4xl font-bold text-slate-50">ホロスコープ・ネイタルチャート</h1>
        <p className="text-sm text-slate-400 mt-2">
          生年月日・出生時間・出生地から、あなたの星の配置を正確に計算します。天体の上にマウスを重ねると詳しい情報が表示されます。
        </p>
      </header>

      {/* ---- 入力フォーム ---- */}
      <div className="bg-slate-900/70 border border-indigo-900/50 rounded-2xl p-6 mb-8 grid grid-cols-2 md:grid-cols-4 gap-4">
        <div className="flex flex-col gap-1">
          <label className="text-xs text-slate-400">生年月日</label>
          <input type="date" value={date} onChange={e => setDate(e.target.value)}
                 className="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-400"/>
        </div>
        <div className="flex flex-col gap-1">
          <label className="text-xs text-slate-400">出生時間</label>
          <input type="time" value={time} onChange={e => setTime(e.target.value)}
                 className="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-400"/>
        </div>
        <div className="flex flex-col gap-1">
          <label className="text-xs text-slate-400">出生地（都道府県）</label>
          <select value={pref} onChange={e => onPrefChange(e.target.value)}
                  className="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-400">
            {prefList.map(p => <option key={p} value={p}>{p}</option>)}
          </select>
        </div>
        <div className="flex flex-col gap-1">
          <label className="text-xs text-slate-400">出生地（市区町村）</label>
          <select value={city} onChange={e => setCity(e.target.value)}
                  className="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-400">
            {cityList.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>
      </div>
      {chart && (
        <p className="text-center text-xs text-slate-500 -mt-4 mb-6">
          座標: 北緯{parseFloat(geocode(pref, city).lat).toFixed(4)}° ／ 東経{parseFloat(geocode(pref, city).lon).toFixed(4)}°
          （{pref}{city}の代表点を自動取得）
        </p>
      )}

      {error && <p className="text-rose-400 text-sm mb-4 text-center">{error}</p>}

      {chart && (
        <div className="grid md:grid-cols-[auto_1fr] gap-8 items-start justify-center">
          {/* ---- SVG ホロスコープ ---- */}
          <div className="relative mx-auto" style={{ width: 600, height: 600 }}>
            <svg viewBox="0 0 600 600" width="600" height="600" className="select-none">
              <circle cx={cx} cy={cy} r={rOuter} fill="#0f231d" stroke="rgba(201,162,75,0.35)" strokeWidth="1"/>
              <circle cx={cx} cy={cy} r={rSignIn} fill="none" stroke="rgba(201,162,75,0.35)" strokeWidth="1" opacity="0.6"/>
              <circle cx={cx} cy={cy} r={rHouseIn} fill="none" stroke="#3a3560" strokeWidth="1" opacity="0.5"/>

              {/* 星座リング（12等分、外側） */}
              {SIGNS.map((s, i) => {
                const a0 = rel(i * 30), a1 = rel(i * 30 + 30);
                const mid = rel(i * 30 + 15);
                const p0 = angleToXY(a0, rOuter, cx, cy);
                const p1 = angleToXY(a0, rSignIn, cx, cy);
                const labelPos = angleToXY(mid, (rOuter + rSignIn) / 2, cx, cy);
                const midPos = angleToXY(mid, rOuter, cx, cy);
                const arc0 = angleToXY(a0, rOuter, cx, cy);
                const arc1 = angleToXY(a1, rOuter, cx, cy);
                return (
                  <g key={'sign' + i}
                     onMouseEnter={() => showTooltip(midPos.x, midPos.y, [s.name])}
                     onMouseLeave={hideTooltip}
                     className="cursor-pointer">
                    <path d={`M${cx},${cy} L${p0.x.toFixed(2)},${p0.y.toFixed(2)} A${rOuter},${rOuter} 0 0 1 ${arc1.x.toFixed(2)},${arc1.y.toFixed(2)} Z`}
                          fill={i % 2 === 0 ? '#1a1f3a' : '#141830'} opacity="0.001" />
                    <line x1={p0.x.toFixed(2)} y1={p0.y.toFixed(2)}
                          x2={angleToXY(a0, rOuter, cx, cy).x.toFixed(2)} y2={angleToXY(a0, rOuter, cx, cy).y.toFixed(2)}
                          stroke="rgba(201,162,75,0.35)" strokeWidth="1"/>
                    <line x1={angleToXY(a0, rSignIn, cx, cy).x.toFixed(2)} y1={angleToXY(a0, rSignIn, cx, cy).y.toFixed(2)}
                          x2={angleToXY(a0, rOuter, cx, cy).x.toFixed(2)} y2={angleToXY(a0, rOuter, cx, cy).y.toFixed(2)}
                          stroke="rgba(201,162,75,0.35)" strokeWidth="1"/>
                    <text x={labelPos.x.toFixed(2)} y={labelPos.y.toFixed(2)} textAnchor="middle" dominantBaseline="middle"
                          fontSize="20" fill="#f4ecd8" className="glyph-text">{s.glyph}</text>
                  </g>
                );
              })}

              {/* ハウスカスプ（プラシーダス方式、不等分割） */}
              {Array.from({ length: 12 }, (_, idx) => idx + 1).map(n => {
                const a = rel(chart.houses[n]);
                const p0 = angleToXY(a, rHouseIn, cx, cy);
                const p1 = angleToXY(a, rSignIn, cx, cy);
                const isAngular = n === 1 || n === 4 || n === 7 || n === 10;
                const numAngle = rel(chart.houses[n] + (norm360(chart.houses[n % 12 + 1] - chart.houses[n]) / 6));
                const numPos = angleToXY(numAngle, rHouseIn - 18, cx, cy);
                return (
                  <g key={'house' + n}>
                    <line x1={p0.x.toFixed(2)} y1={p0.y.toFixed(2)} x2={p1.x.toFixed(2)} y2={p1.y.toFixed(2)}
                          stroke={isAngular ? '#e6c777' : 'rgba(244,236,216,0.28)'} strokeWidth={isAngular ? 1.6 : 1}/>
                    <text x={numPos.x.toFixed(2)} y={numPos.y.toFixed(2)} textAnchor="middle" dominantBaseline="middle"
                          fontSize="11" fill="#a9c2b8">{n}</text>
                  </g>
                );
              })}

              {/* ASC / MC ラベル */}
              {[['ASC', chart.asc], ['MC', chart.mc]].map(([label, deg]) => {
                const a = rel(deg);
                const p = angleToXY(a, rOuter + 14, cx, cy);
                return (
                  <text key={label} x={p.x.toFixed(2)} y={p.y.toFixed(2)} textAnchor="middle" dominantBaseline="middle"
                        fontSize="12" fontWeight="700" fill="#e6c777">{label}</text>
                );
              })}

              {/* 天体 */}
              {planetPositions.map(p => {
                const pos = angleToXY(p.angle, p.r, cx, cy);
                const tipLines = [
                  `${p.name} ${p.glyph}`,
                  fmtDeg(p.lon),
                  `第${p.house}ハウス`
                ];
                return (
                  <g key={p.key}
                     onMouseEnter={() => showTooltip(pos.x, pos.y, tipLines)}
                     onMouseLeave={hideTooltip}
                     className="cursor-pointer">
                    {/* ヒットエリア（ホバーしやすいよう少し大きめの透明円。天体アイコンの背面に配置） */}
                    <circle cx={pos.x.toFixed(2)} cy={pos.y.toFixed(2)} r="16" fill="transparent"/>
                    <circle cx={pos.x.toFixed(2)} cy={pos.y.toFixed(2)} r="11" fill="#0f231d" stroke={p.color} strokeWidth="1.4"/>
                    <text x={pos.x.toFixed(2)} y={pos.y.toFixed(2)} textAnchor="middle" dominantBaseline="middle"
                          fontSize="13" fill={p.color} className="glyph-text">{p.glyph}</text>
                  </g>
                );
              })}

              {/* 中心 */}
              <circle cx={cx} cy={cy} r="2.5" fill="#e6c777"/>

              {/* ツールチップ（SVG内に直接描画。座標変換のズレを避けるため） */}
              {hover && (() => {
                const w = Math.max(...hover.lines.map(l => l.length)) * 8 + 20;
                const h = hover.lines.length * 16 + 14;
                let tx = hover.x + 14, ty = hover.y - h / 2;
                if (tx + w > 598) tx = hover.x - w - 14;
                if (ty < 2) ty = 2;
                if (ty + h > 598) ty = 598 - h;
                return (
                  <g pointerEvents="none">
                    <rect x={tx} y={ty} width={w} height={h} rx="8" fill="#152a22" stroke="#e6c777" strokeWidth="1" opacity="0.96"/>
                    {hover.lines.map((line, i) => (
                      <text key={i} x={tx + 10} y={ty + 18 + i * 16} fontSize="12.5"
                            fill={i === 0 ? '#e6c777' : '#f4ecd8'} fontWeight={i === 0 ? '700' : '400'}>{line}</text>
                    ))}
                  </g>
                );
              })()}
            </svg>
          </div>

          {/* ---- サイドパネル：計算結果一覧 ---- */}
          <div className="bg-slate-900/70 border border-indigo-900/50 rounded-2xl p-6 space-y-4">
            <div>
              <h2 className="text-sm tracking-widest text-indigo-300 uppercase mb-2">アセンダント・MC</h2>
              <div className="grid grid-cols-2 gap-2 text-sm">
                <div className="bg-slate-800/60 rounded-lg px-3 py-2">ASC(第1ハウス): <span className="text-amber-300">{fmtDeg(chart.asc)}</span></div>
                <div className="bg-slate-800/60 rounded-lg px-3 py-2">MC(第10ハウス): <span className="text-amber-300">{fmtDeg(chart.mc)}</span></div>
              </div>
            </div>
            <div>
              <h2 className="text-sm tracking-widest text-indigo-300 uppercase mb-2">天体の位置</h2>
              <ul className="space-y-1 text-sm">
                {BODIES.map(b => (
                  <li key={b.key} className="flex items-center justify-between bg-slate-800/40 rounded-lg px-3 py-1.5">
                    <span style={{ color: b.color }}>{b.glyph} {b.name}</span>
                    <span className="text-slate-300">{fmtDeg(chart.bodies[b.key])}</span>
                    <span className="text-slate-500 text-xs">第{chart.bodyHouses[b.key]}ハウス</span>
                  </li>
                ))}
              </ul>
            </div>

            <div className="text-center">
              <button className="details-toggle" onClick={() => setShowDetails(v => !v)}>
                {showDetails ? '詳細データを閉じる ▲' : '詳細データを見る（12ハウス・計算値） ▼'}
              </button>
            </div>

            {showDetails && (
              <div>
                <h2 className="text-sm tracking-widest text-indigo-300 uppercase mb-2 mt-2">12ハウスカスプ（プラシーダス方式）</h2>
                <div className="grid grid-cols-2 gap-x-4 gap-y-1 text-xs text-slate-400">
                  {Array.from({ length: 12 }, (_, i) => i + 1).map(n => (
                    <div key={n}>第{n}ハウス: <span className="text-slate-300">{fmtDeg(chart.houses[n])}</span></div>
                  ))}
                </div>
                <p className="text-[11px] text-slate-500 pt-2 border-t border-slate-800 mt-2">
                  黄道傾斜角 ε = {chart.eps.toFixed(4)}° ／ RAMC(南中点の赤経) = {chart.RAMC.toFixed(4)}°<br/>
                  天体位置は astronomy-engine による実計算、ハウスカスプはプラシーダス方式（反復計算、均等分割なし）で算出しています。<br/>
                  ※ 極域(概ね緯度66°以上)ではプラシーダス方式が数学的に破綻するため、カスプ値が不安定になる場合があります。
                </p>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
